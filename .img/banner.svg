<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">DemonHunter — Dark Terminal</title>
  <desc id="desc">Hacker futurista con terminal, circuitos y acentos verde neón.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".58" stop-color="#001a0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00ff41" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1500" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1500" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1500" height="420" rx="18" fill="url(#scan)"/>

  <!-- Circuitos decorativos -->
  <g fill="none" stroke="#00ff41" stroke-width="2" opacity=".42">
    <path d="M0 86H150L184 120H290M0 112H105L135 142H210"/>
    <path d="M1500 74H1370L1338 106H1240M1500 104H1415L1380 139H1310"/>
    <path d="M0 330H120L158 292H250M1500 320H1390L1352 282H1260"/>
    <path d="M116 0V45L145 74H218M1380 0V42L1350 72H1280"/>
  </g>
  <g fill="#00ff41" opacity=".7">
    <circle cx="290" cy="120" r="4"/><circle cx="210" cy="142" r="4"/>
    <circle cx="1240" cy="106" r="4"/><circle cx="1310" cy="139" r="4"/>
    <circle cx="250" cy="292" r="4"/><circle cx="1260" cy="282" r="4"/>
  </g>

  <!-- Panel de terminal -->
  <g transform="translate(930 92)">
    <rect width="470" height="230" rx="12" fill="#050a07" fill-opacity=".88" stroke="#00ff41" stroke-opacity=".75" stroke-width="1.5"/>
    <path d="M0 42H470" stroke="#00ff41" stroke-opacity=".45"/>
    <circle cx="22" cy="21" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="21" r="5" fill="#ffbd2e"/>
    <circle cx="62" cy="21" r="5" fill="#27c93f"/>
    <text x="88" y="26" fill="#8ca894" font-family="monospace" font-size="12">root@demon: ~/profile</text>
    <g font-family="monospace" font-size="15">
      <text x="24" y="78" fill="#00ff41">$ whoami</text>
      <text x="24" y="106" fill="#d5f7dc">DemonHunter</text>
      <text x="24" y="145" fill="#00ff41">$ ./init_profile.sh --stealth</text>
      <text x="24" y="174" fill="#9be7aa">[+] SYSTEM ONLINE</text>
      <text x="24" y="199" fill="#9be7aa">[+] MODE: DARK TERMINAL</text>
      <rect x="24" y="211" width="9" height="16" fill="#00ff41" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Título -->
  <g transform="translate(92 0)">
    <text x="0" y="174" fill="#00ff41" font-family="monospace" font-size="18" letter-spacing="5" opacity=".9">&gt; IDENTITY // PROFILE</text>
    <text x="-3" y="258" fill="#00ff41" opacity=".25" filter="url(#softGlow)" font-family="monospace" font-size="76" font-weight="700">DemonHunter</text>
    <text x="0" y="252" fill="#00ff41" font-family="monospace" font-size="76" font-weight="700">DemonHunter</text>
    <rect x="2" y="278" width="650" height="2" fill="url(#glow)"/>
    <text x="3" y="319" fill="#c5e8ce" font-family="monospace" font-size="21" letter-spacing="2">REVERSE ENGINEERING  //  ANDROID  //  LINUX</text>
    <text x="3" y="354" fill="#6ca77a" font-family="monospace" font-size="14">[ ACCESS: ROOT ]  [ STATUS: ONLINE ]  [ TRACE: 0x00 ]</text>
  </g>

  <path d="M0 397H1500" stroke="#00ff41" stroke-opacity=".7"/>
  <path d="M0 400H1500" stroke="#00ff41" stroke-opacity=".12"/>
  <text x="1450" y="386" text-anchor="end" fill="#00ff41" opacity=".65" font-family="monospace" font-size="11">DH // 0x00FF41</text>
</svg>
